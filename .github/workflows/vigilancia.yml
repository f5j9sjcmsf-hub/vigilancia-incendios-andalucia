name: Vigilancia Andalucía

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Europe/Madrid
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  # Solo hay un vigilante activo y un relevo pendiente. Cada ejecución
  # crea su sucesora sin depender de disparos programados.
  group: vigilancia-andalucia
  cancel-in-progress: false

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Vigilar y guardar estado cada 15 minutos
        timeout-minutes: 95
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Cada run mantiene la vigilancia durante unos 75 minutos y deja
          # el relevo a un segundo job independiente.
          for iteration in $(seq 1 6); do
            echo "Comprobación $iteration/6"
            python src/main.py

            if git diff --quiet -- data/state.json; then
              echo "No hay cambios en el estado que guardar."
            else
              cp data/state.json "$RUNNER_TEMP/state.json"
              git checkout -- data/state.json
              git pull --rebase origin main
              cp "$RUNNER_TEMP/state.json" data/state.json
              git add data/state.json
              git commit -m "Actualizar estado de vigilancia"
              git push
            fi

            if [ "$iteration" -lt 6 ]; then
              sleep 900
            fi
          done

  relevo:
    name: Preparar siguiente vigilancia
    needs: vigilancia
    if: ${{ always() && needs.vigilancia.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Esperar antes de reintentar tras un fallo
        if: ${{ needs.vigilancia.result != 'success' }}
        run: sleep 900

      - name: Lanzar el siguiente relevo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 60 \
            --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/vigilancia.yml/dispatches" \
            --data '{"ref":"main"}'
