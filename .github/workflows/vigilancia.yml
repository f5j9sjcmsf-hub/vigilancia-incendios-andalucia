name: Vigilancia Andalucía

on:
  workflow_dispatch:
  schedule:
    # Cuatro oportunidades por hora, fuera del minuto 0 (más congestionado).
    - cron: "7,22,37,52 * * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

env:
  TZ: Europe/Madrid
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  # Solo hay un vigilante activo. Los disparos nuevos quedan como relevo
  # para cuando finalice la ventana actual.
  group: vigilancia-andalucia
  cancel-in-progress: false

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Vigilar y guardar estado cada 15 minutos
        timeout-minutes: 95
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Un run programado de GitHub puede retrasarse o descartarse. Cada
          # run que sí comienza mantiene la vigilancia durante unos 75 minutos;
          # los cuatro cron por hora aportan los relevos de reserva.
          for iteration in $(seq 1 6); do
            echo "Comprobación $iteration/6"
            python src/main.py

            if git diff --quiet -- data/state.json; then
              echo "No hay cambios en el estado que guardar."
            else
              cp data/state.json "$RUNNER_TEMP/state.json"
              git checkout -- data/state.json
              git pull --rebase origin main
              cp "$RUNNER_TEMP/state.json" data/state.json
              git add data/state.json
              git commit -m "Actualizar estado de vigilancia"
              git push
            fi

            if [ "$iteration" -lt 6 ]; then
              sleep 900
            fi
          done
