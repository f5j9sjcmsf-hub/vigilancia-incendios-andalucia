name: Vigilancia Andalucía

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Europe/Madrid
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  # Solo hay un vigilante activo y un relevo pendiente. Cada ejecución
  # crea su sucesora sin depender de disparos programados.
  group: vigilancia-andalucia
  cancel-in-progress: false

jobs:
  vigilancia:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cargar estado operativo
        run: |
          git fetch origin estado
          git show origin/estado:data/state.json > data/state.json

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Vigilar y guardar estado cada 15 minutos
        timeout-minutes: 95
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Cada run mantiene la vigilancia durante unos 75 minutos y deja
          # el relevo a un segundo job independiente.
          for iteration in $(seq 1 6); do
            echo "Comprobación $iteration/6"
            cp data/state.json "$RUNNER_TEMP/state-before.json"
            python src/main.py

            if cmp --silent "$RUNNER_TEMP/state-before.json" data/state.json; then
              echo "No hay cambios en el estado que guardar."
            else
              cp data/state.json "$RUNNER_TEMP/state.json"
              git fetch origin estado
              # El estado ya está a salvo en RUNNER_TEMP: limpiamos la copia
              # de main antes de cambiar de rama para evitar conflictos.
              git restore data/state.json
              git switch --force-create estado origin/estado
              cp "$RUNNER_TEMP/state.json" data/state.json
              git add data/state.json
              git commit -m "Actualizar estado de vigilancia"
              git push origin HEAD:estado
              git switch --force main
              git pull --ff-only origin main
              cp "$RUNNER_TEMP/state.json" data/state.json
            fi

            if [ "$iteration" -lt 6 ]; then
              sleep 900
            fi
          done

  relevo:
    name: Preparar siguiente vigilancia
    needs: vigilancia
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esperar antes de reintentar tras un fallo
        if: ${{ needs.vigilancia.result != 'success' }}
        run: sleep 900

      - name: Lanzar el siguiente relevo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 60 \
            --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/vigilancia.yml/dispatches" \
            --data '{"ref":"main"}'
