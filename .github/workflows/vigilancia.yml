name: Vigilancia Andalucía

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions:
  contents: write

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Madrid
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar horario de España
        id: horario
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          MINUTO=$(TZ=Europe/Madrid date +%M)

          echo "Hora oficial de España: ${HORA}:${MINUTO}"

          if [ "$HORA" -lt 7 ] || [ "$HORA" -gt 22 ]; then
            echo "fuera_horario=true" >> "$GITHUB_OUTPUT"
            echo "Fuera del horario de vigilancia."
          elif [ "$HORA" -eq 22 ] && [ "$MINUTO" -gt 0 ]; then
            echo "fuera_horario=true" >> "$GITHUB_OUTPUT"
            echo "Fuera del horario de vigilancia."
          else
            echo "fuera_horario=false" >> "$GITHUB_OUTPUT"
            echo "Dentro del horario de vigilancia."
          fi

      - name: Instalar dependencias
        if: steps.horario.outputs.fuera_horario == 'false'
        run: pip install -r requirements.txt

      - name: Ejecutar vigilancia
        if: steps.horario.outputs.fuera_horario == 'false'
        working-directory: src
        run: python main.py

      - name: Guardar estado
        if: steps.horario.outputs.fuera_horario == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json

          git diff --cached --quiet || git commit -m "Actualizar estado de vigilancia"

          git push
